# Pipeline principal do B2B Sales Intelligence.
#
# Etapas:
#   - 01-bronze (implementada): ingestão dos CSVs de fixtures/ via volume
#     gerenciado raw_data (bronze_companies, bronze_employees)
#   - 02-silver: limpeza, tipagem, deduplicação e relacionamento
#   - 03-gold:   oportunidades comerciais e contatos recomendados

resources:
  pipelines:
    b2b_sales_intelligence_etl:
      name: b2b_sales_intelligence_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/b2b_sales_intelligence_etl"

      configuration:
        # Caminho do volume gerenciado com os CSVs de fixtures/.
        # Resolvido pelo bundle a partir do recurso resources.volumes.raw_data
        # (catalog/schema nunca fixados no código).
        source_base_path: ${resources.volumes.raw_data.volume_path}

      libraries:
        - glob:
            include: ../src/b2b_sales_intelligence_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
