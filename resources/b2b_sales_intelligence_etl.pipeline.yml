# Pipeline principal do B2B Sales Intelligence.
#
# As transformações serão adicionadas em src/b2b_sales_intelligence_etl/transformations/
# nas próximas etapas, sem lógica de negócio nesta etapa 00:
#   - 01-bronze: ingestão dos CSVs de fixtures/ (bronze_companies, bronze_employees)
#   - 02-silver: limpeza, tipagem, deduplicação e relacionamento
#   - 03-gold:   oportunidades comerciais e contatos recomendados

resources:
  pipelines:
    b2b_sales_intelligence_etl:
      name: b2b_sales_intelligence_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/b2b_sales_intelligence_etl"

      libraries:
        - glob:
            include: ../src/b2b_sales_intelligence_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
