# The main pipeline for b2b_sales_intelligence

resources:
  pipelines:
    b2b_sales_intelligence_etl:
      name: b2b_sales_intelligence_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/b2b_sales_intelligence_etl"

      libraries:
        - glob:
            include: ../src/b2b_sales_intelligence_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
