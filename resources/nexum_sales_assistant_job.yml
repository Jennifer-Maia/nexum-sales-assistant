# Job principal do Nexum Sales Assistant: apenas dispara a pipeline ETL.

resources:
  jobs:
    nexum_sales_assistant_job:
      name: nexum_sales_assistant_job

      trigger:
        # Roda o job diariamente; no target dev (mode: development) o gatilho fica pausado.
        periodic:
          interval: 1
          unit: DAYS

      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.nexum_sales_assistant_etl.id}
